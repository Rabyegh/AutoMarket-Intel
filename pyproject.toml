[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automarket"
version = "0.1.0"
description = "AutoMarket Intel — Used-Car Pricing & Inventory Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyarrow>=16",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "pydantic>=2",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
automarket = "automarket.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8",
    "moto[s3]>=5.0",
    "dbt-snowflake>=1.8",
]
cloud = [
    "boto3>=1.34",
    "snowflake-connector-python>=3.10",
    "dbt-snowflake>=1.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: fast tests with no I/O or network",
    "integration: tests that use DuckDB and fixture files",
]
