[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vinpipe"
version = "0.1.0"
description = "VIN Fleet Enrichment Pipeline — Used-Car Pricing & Inventory Intelligence"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10",
    "httpx>=0.27",
    "pyarrow>=16",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "pydantic>=2",
    "tenacity>=8",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
vinpipe = "vinpipe.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: fast, no network, no IO",
    "integration: uses DuckDB and fixture files",
]
