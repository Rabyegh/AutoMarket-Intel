version: 2

sources:
  - name: raw
    description: >
      Append-only raw tables loaded by the Python ingestion pipeline from
      UK used-car listing CSV files. This is a static snapshot dataset;
      it does not contain real listing publication timestamps.
    # database resolves to:
    #   - 'warehouse'     when target=duckdb (local; DuckDB file is named warehouse.duckdb)
    #   - SNOWFLAKE_DATABASE (e.g. AUTOMARKET_DB) when target=snowflake
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'warehouse') }}"
    schema: raw
    tables:
      - name: raw_used_car_listings
        description: >
          Normalised used-car listings accepted by the validation pipeline.
          One row per source CSV record that passed all validation checks.
          The source_file column preserves file provenance.
        columns:
          - name: row_id
            description: Deterministic 16-char hex hash of source_file + row_index + key fields.
            tests: [not_null, unique]
          - name: source_file
            description: Original CSV filename (e.g. audi.csv).
            tests: [not_null]
          - name: make
            description: Canonical vehicle make derived from the CSV filename.
            tests: [not_null]
          - name: model
            description: Model name as provided in the source file.
            tests: [not_null]
          - name: year
            description: Registration year.
            tests: [not_null]
          - name: price_gbp
            description: Asking price in GBP. NOT a transaction price.
            tests: [not_null]
          - name: transmission
            description: "Normalised transmission: Manual | Automatic | Semi-Auto | Other."
            tests:
              - not_null
              - accepted_values:
                  values: ["Manual", "Automatic", "Semi-Auto", "Other"]
          - name: mileage_miles
            description: Odometer reading in miles at time of listing.
            tests: [not_null]
          - name: fuel_type
            description: "Normalised fuel type: Petrol | Diesel | Hybrid | Electric | Other."
            tests:
              - not_null
              - accepted_values:
                  values: ["Petrol", "Diesel", "Hybrid", "Electric", "Other"]
          - name: tax_gbp
            description: Annual road tax in GBP. Nullable — not present in all source files.
          - name: mpg
            description: Miles per gallon. Nullable — not present in all source files.
          - name: engine_size_l
            description: Engine displacement in litres.

      - name: raw_quarantine
        description: >
          Records rejected by the validation pipeline with the rejection reason.
          Used for data-quality observability. Not included in analytical models.
        columns:
          - name: row_id
            tests: [not_null]
          - name: source_file
            tests: [not_null]
          - name: rejection_reason
            tests: [not_null]
